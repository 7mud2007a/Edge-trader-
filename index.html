<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EDGE TRADER | Authentication</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css"
    >

    <!-- Main CSS -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- Website Name -->
    <div class="site-name">EDGE TRADER</div>

    <div class="container" id="container">

        <!-- =========================
             SIGN UP
        ========================== -->
        <div class="form-container sign-up-container">

            <form id="signUpForm">

                <h1>Create Account</h1>

                <div class="social-container">

                    <button type="button"
                            class="social"
                            data-provider="facebook"
                            aria-label="Continue with Facebook">
                        <i class="fab fa-facebook-f"></i>
                    </button>

                    <button type="button"
                            class="social"
                            data-provider="google"
                            aria-label="Continue with Google">
                        <i class="fab fa-google"></i>
                    </button>

                    <button type="button"
                            class="social"
                            data-provider="linkedin_oidc"
                            aria-label="Continue with LinkedIn">
                        <i class="fab fa-linkedin-in"></i>
                    </button>

                </div>

                <span>or use your email for registration</span>

                <input
                    id="signUpName"
                    type="text"
                    placeholder="Name"
                    autocomplete="name"
                    required
                >

                <input
                    id="signUpEmail"
                    type="email"
                    placeholder="Email"
                    autocomplete="email"
                    required
                >

                <input
                    id="signUpPassword"
                    type="password"
                    placeholder="Password"
                    autocomplete="new-password"
                    required
                >

                <button
                    id="signUpSubmit"
                    type="submit">
                    Sign Up
                </button>

                <div
                    id="signUpMessage"
                    class="auth-message"
                    role="alert"
                    aria-live="polite">
                </div>

            </form>

        </div>


        <!-- =========================
             SIGN IN
        ========================== -->
        <div class="form-container sign-in-container">

            <form id="signInForm">

                <h1>Sign In</h1>

                <div class="social-container">

                    <button type="button"
                            class="social"
                            data-provider="facebook"
                            aria-label="Continue with Facebook">
                        <i class="fab fa-facebook-f"></i>
                    </button>

                    <button type="button"
                            class="social"
                            data-provider="google"
                            aria-label="Continue with Google">
                        <i class="fab fa-google"></i>
                    </button>

                    <button type="button"
                            class="social"
                            data-provider="linkedin_oidc"
                            aria-label="Continue with LinkedIn">
                        <i class="fab fa-linkedin-in"></i>
                    </button>

                </div>

                <span>or use your account</span>

                <input
                    id="signInEmail"
                    type="email"
                    placeholder="Email"
                    autocomplete="email"
                    required
                >

                <input
                    id="signInPassword"
                    type="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >

                <button
                    id="forgotPasswordButton"
                    type="button"
                    class="forgot">
                    Forgot your password?
                </button>

                <button
                    id="signInSubmit"
                    type="submit">
                    Sign In
                </button>

                <div
                    id="signInMessage"
                    class="auth-message"
                    role="alert"
                    aria-live="polite">
                </div>

            </form>

        </div>


        <!-- =========================
             OVERLAY
        ========================== -->
        <div class="overlay-container">

            <div class="overlay">

                <div class="overlay-panel overlay-left">

                    <h1>Welcome Back!</h1>

                    <p>
                        Sign in to continue where you left off.
                    </p>

                    <button
                        class="ghost"
                        id="signIn"
                        type="button">
                        Sign In
                    </button>

                </div>


                <div class="overlay-panel overlay-right">

                    <h1>Hello, Friend!</h1>

                    <p>
                        Create your account and start your journey with us.
                    </p>

                    <button
                        class="ghost"
                        id="signUp"
                        type="button">
                        Sign Up
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- =========================
         FORGOT PASSWORD MODAL
    ========================== -->
    <div
        class="modal"
        id="forgotPasswordModal"
        aria-hidden="true">

        <div class="modal-content">

            <button
                type="button"
                class="modal-close"
                id="closeForgotPassword"
                aria-label="Close">
                &times;
            </button>

            <h2>Reset Password</h2>

            <p>
                Enter your email and we'll send you a password reset link.
            </p>

            <form id="forgotPasswordForm">

                <input
                    id="forgotPasswordEmail"
                    type="email"
                    placeholder="Email"
                    autocomplete="email"
                    required
                >

                <button
                    id="forgotPasswordSubmit"
                    type="submit">
                    Send Reset Link
                </button>

                <div
                    id="forgotPasswordMessage"
                    class="auth-message"
                    role="alert"
                    aria-live="polite">
                </div>

            </form>

        </div>

    </div>


    <!-- Supabase will be connected in script.js -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./script.js"></script>

</body>

</html>
